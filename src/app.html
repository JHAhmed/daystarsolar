<!doctype html>
<html lang="en" class="no-js">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Runs before first paint. Everything marked [data-reveal] only hides
			itself once this class is gone, so a crawler or a failed bundle sees
			fully visible content instead of a page of invisible sections.
		-->
		<script>
			document.documentElement.classList.remove('no-js');
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://api.fontshare.com" />

		<!--
			Two families only. Poppins carries body copy and UI (unchanged from the
			previous site), Clash Display carries headings. Satoshi is loaded for the
			PDF report, which renders in its own print context.
			Outfit and Caveat were being loaded site-wide previously and never used.
		-->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600&f[]=satoshi@400,500,700&display=swap"
		/>

		<!--
			Sitewide OG defaults. Only tags that are genuinely constant live here.
			Per-page title, description, canonical, og:title/description/image are
			set by the Seo component on each route — putting defaults for those in
			a shared location makes every page emit two of each, which is what was
			previously sending the homepage's title to search engines for every URL.
		-->
		<meta property="og:site_name" content="Daystar Solar" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Umami -->
		<script
			defer
			src="https://cloud.umami.is/script.js"
			data-website-id="fdff27c2-0ba8-46a4-b288-e707835f30ac"
		></script>

		<!-- Meta Pixel -->
		<script>
			!(function (f, b, e, v, n, t, s) {
				if (f.fbq) return;
				n = f.fbq = function () {
					n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
				};
				if (!f._fbq) f._fbq = n;
				n.push = n;
				n.loaded = !0;
				n.version = '2.0';
				n.queue = [];
				t = b.createElement(e);
				t.async = !0;
				t.src = v;
				s = b.getElementsByTagName(e)[0];
				s.parentNode.insertBefore(t, s);
			})(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
			fbq('init', '1774534922812759');
			fbq('track', 'PageView');
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<img
				height="1"
				width="1"
				style="display: none"
				src="https://www.facebook.com/tr?id=1774534922812759&ev=PageView&noscript=1"
				alt="Facebook tracking pixel"
			/>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
